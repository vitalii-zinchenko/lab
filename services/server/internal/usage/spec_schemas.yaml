components:
  schemas:
    DailyUsage:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    UsageStats:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "./spec_schemas.yaml#/components/schemas/DailyUsage"

    NewUsage:
      type: object
      required: [user_id, timestamp, operation]
      properties:
        user_id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        operation:
          type: string

    UsageItem:
      type: object
      required: [id, user_id, timestamp, operation]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        operation:
          type: string
