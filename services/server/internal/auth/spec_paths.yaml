paths:
  /users:
    post:
      operationId: CreateUser
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./spec_schemas.yaml#/components/schemas/NewUser"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/User"
        "409":
          description: Username or email already taken
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

  /token:
    post:
      operationId: CreateToken
      summary: Exchange client credentials for a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./spec_schemas.yaml#/components/schemas/TokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/TokenResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"
        "401":
          description: Invalid credentials, expired, or revoked key
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

  /api-keys:
    post:
      operationId: CreateApiKey
      summary: Create a new API key for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./spec_schemas.yaml#/components/schemas/NewApiKey"
      responses:
        "201":
          description: Created — client_secret is shown only once
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/CreatedApiKey"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

    get:
      operationId: ListApiKeys
      summary: List API keys for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./spec_schemas.yaml#/components/schemas/ApiKey"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

  /api-keys/{clientId}:
    delete:
      operationId: RevokeApiKey
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"
