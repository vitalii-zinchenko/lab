components:
  schemas:
    User:
      type: object
      required: [id, username, email, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    NewUser:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64

    NewApiKey:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
        expires_at:
          type: string
          format: date-time

    ApiKey:
      type: object
      required: [client_id, created_at]
      properties:
        client_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    CreatedApiKey:
      type: object
      required: [client_id, client_secret, created_at]
      properties:
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
