components:
  schemas:
    Post:
      type: object
      required: [id, userId, content, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NewPost:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    UpdatePost:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    PostPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "./spec_schemas.yaml#/components/schemas/Post"
        nextCursor:
          type: string
