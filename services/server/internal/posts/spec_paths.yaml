paths:
  /posts:
    get:
      tags: [Posts]
      operationId: ListPosts
      summary: List posts for a user (cursor-paginated)
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated posts
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/PostPage"

    post:
      tags: [Posts]
      operationId: CreatePost
      summary: Create a post for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./spec_schemas.yaml#/components/schemas/NewPost"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/Post"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

  /posts/{id}:
    get:
      tags: [Posts]
      operationId: GetPost
      summary: Get a post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"

    patch:
      tags: [Posts]
      operationId: UpdatePost
      summary: Update a post's content (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./spec_schemas.yaml#/components/schemas/UpdatePost"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./spec_schemas.yaml#/components/schemas/Post"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"
        "404":
          description: Not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: "../shared/spec_schemas.yaml#/components/schemas/Error"
