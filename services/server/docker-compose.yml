networks:
  lab-network:
    external: true

services:
  api:
    build: .
    volumes:
      - .:/app          # mount source so air picks up changes from the host
      - /app/tmp        # keep air's compiled binary inside the container
    ports:
      - "8080:8080"
    networks:
      - lab-network
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-app}
    restart: unless-stopped
