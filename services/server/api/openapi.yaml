openapi: "3.0.3"
info:
  title: Lab API
  version: "1.0.0"

paths:
  /health:
    get:
      operationId: GetHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /items:
    get:
      operationId: ListItems
      summary: List all items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

    post:
      operationId: CreateItem
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

  /events:
    post:
      operationId: CreateEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHistory"

  /ch-events:
    post:
      operationId: CreateChEvent
      summary: Create a ClickHouse event (test endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHistory"

  /items/{id}:
    get:
      operationId: GetItem
      summary: Get an item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      operationId: DeleteItem
      summary: Delete an item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Item:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    NewItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    EventLevel:
      type: string
      enum: [error, warn, info]

    EventHistory:
      type: object
      required: [id, level, event_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/EventLevel"
        event_type:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time

    NewEvent:
      type: object
      required: [level, event_type]
      properties:
        level:
          $ref: "#/components/schemas/EventLevel"
        event_type:
          type: string
          minLength: 1
        details:
          type: string
