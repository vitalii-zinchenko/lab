# PostgreSQL Client Authentication Configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Unix domain socket — trust for local tools (pg_isready, psql inside container)
local   all             all                                     trust

# IPv4/IPv6 localhost — trust for local tools
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Docker network — password auth for all users/databases
host    all             all             0.0.0.0/0               scram-sha-256

# Streaming replication — replicator user from Docker network
host    replication     replicator      0.0.0.0/0               scram-sha-256
